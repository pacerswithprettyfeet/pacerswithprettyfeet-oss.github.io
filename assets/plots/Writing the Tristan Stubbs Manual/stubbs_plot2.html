<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Middle Overs True Dots Jogs Boundaries Radar</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .header {
      padding: 14px 18px 8px;
      border-bottom: 1px solid #e5e7eb;
    }

    .title {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      color: #111827;
    }

    .chart-wrap {
      padding: 4px 6px 8px;
      height: 760px;
    }

    @media (max-width: 700px) {
      .chart-wrap {
        height: 560px;
      }

      .title {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="header">
      <h1 class="title">Middle Overs: True Dots, Jogs and Boundaries</h1>
    </div>

    <div class="chart-wrap">
      <canvas id="radarChart"></canvas>
    </div>
  </div>

  <script>
    const ctx = document.getElementById("radarChart");

    const radarData = {
      labels: ["True Dots", "True Jogs", "True Boundaries"],
      datasets: [
        {
          label: "T Stubbs",
          data: [0.002747275, 0.101238858, -0.103986133],
          borderWidth: 3,
          pointRadius: 4,
          pointHoverRadius: 6,
          fill: true,
          backgroundColor: "rgba(220, 38, 38, 0.10)",
          borderColor: "rgba(220, 38, 38, 0.95)",
          pointBackgroundColor: "rgba(220, 38, 38, 0.95)"
        },
        {
          label: "MS Dhoni",
          data: [0.070129446, -0.020366219, -0.049419636],
          borderWidth: 3,
          pointRadius: 4,
          pointHoverRadius: 6,
          fill: true,
          backgroundColor: "rgba(37, 99, 235, 0.10)",
          borderColor: "rgba(37, 99, 235, 0.95)",
          pointBackgroundColor: "rgba(37, 99, 235, 0.95)"
        },
        {
          label: "Par",
          data: [0, 0, 0],
          borderWidth: 2,
          pointRadius: 3,
          pointHoverRadius: 5,
          fill: false,
          borderColor: "rgba(17, 24, 39, 0.70)",
          pointBackgroundColor: "rgba(17, 24, 39, 0.70)",
          borderDash: [6, 6]
        }
      ]
    };

    new Chart(ctx, {
      type: "radar",
      data: radarData,
      options: {
        responsive: true,
        maintainAspectRatio: false,

        layout: {
          padding: 0
        },

        elements: {
          line: {
            tension: 0
          }
        },

        plugins: {
          legend: {
            position: "top",
            labels: {
              boxWidth: 12,
              padding: 8,
              font: {
                size: 12
              }
            }
          },

          tooltip: {
            callbacks: {
              label: function(context) {
                const value = Number(context.raw);
                return context.dataset.label + ": " + (value * 100).toFixed(2) + "%";
              }
            }
          }
        },

        scales: {
          r: {
            min: -0.12,
            max: 0.12,

            ticks: {
              display: true,
              showLabelBackdrop: false,
              backdropColor: "transparent",
              stepSize: 0.03,
              font: {
                size: 11
              },
              callback: function(value) {
                return (Number(value) * 100).toFixed(0) + "%";
              }
            },

            grid: {
              circular: false,
              color: "rgba(0,0,0,0.12)"
            },

            angleLines: {
              display: true,
              color: "rgba(0,0,0,0.20)"
            },

            pointLabels: {
              padding: 6,
              font: {
                size: 15,
                weight: "bold"
              },
              color: "#374151"
            }
          }
        }
      }
    });
  </script>
</body>
</html>
