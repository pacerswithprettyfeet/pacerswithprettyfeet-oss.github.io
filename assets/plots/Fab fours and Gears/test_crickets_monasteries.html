<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test cricket's monasteries</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: #ffffff;
      color: #17212b;
      font-family: Arial, Helvetica, sans-serif;
    }

    figure {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
    }

    .chart-wrap {
      position: relative;
      width: 100%;
      min-width: 0;
      height: 575px;
      padding: 0 4px 0 0;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100% !important;
      max-width: 100%;
    }

    figcaption {
      padding: 4px 10px 0 119px;
      color: #61707d;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: 0;
    }

    @media (max-width: 620px) {
      .chart-wrap { height: 575px; }
      figcaption {
        padding: 4px 7px 0 94px;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <figure>
    <div class="chart-wrap">
      <canvas id="monasteriesChart" aria-label="Top 15 fractions of balls in gear 0 among men's Test batters with at least 1,500 runs"></canvas>
    </div>
    <figcaption>Test cricket's monasteries. Highest fractions of balls in gear 0 among men's Test batters with at least 1,500 runs in the available ball-by-ball data.</figcaption>
  </figure>

  <script>
    const PLAYERS = [{"rank":1,"batter":"ND McKenzie","careerRuns":1610,"totalBalls":3838,"gearBalls":1575,"gearShare":41.04,"highlight":false},{"rank":2,"batter":"HDRL Thirimanne","careerRuns":2088,"totalBalls":5294,"gearBalls":2029,"gearShare":38.33,"highlight":false},{"rank":3,"batter":"MJ Guptill","careerRuns":2586,"totalBalls":5548,"gearBalls":1979,"gearShare":35.67,"highlight":true},{"rank":4,"batter":"R Dravid","careerRuns":5925,"totalBalls":13733,"gearBalls":4888,"gearShare":35.59,"highlight":true},{"rank":5,"batter":"KC Brathwaite","careerRuns":5931,"totalBalls":14523,"gearBalls":5144,"gearShare":35.42,"highlight":false},{"rank":6,"batter":"F du Plessis","careerRuns":4163,"totalBalls":8986,"gearBalls":3130,"gearShare":34.83,"highlight":true},{"rank":7,"batter":"CA Pujara","careerRuns":7160,"totalBalls":16165,"gearBalls":5615,"gearShare":34.74,"highlight":true},{"rank":8,"batter":"JK Silva","careerRuns":2099,"totalBalls":5212,"gearBalls":1808,"gearShare":34.69,"highlight":false},{"rank":9,"batter":"M Vijay","careerRuns":3877,"totalBalls":8448,"gearBalls":2861,"gearShare":33.87,"highlight":false},{"rank":10,"batter":"Salman Butt","careerRuns":1619,"totalBalls":3527,"gearBalls":1186,"gearShare":33.63,"highlight":false},{"rank":11,"batter":"Taufeeq Umar","careerRuns":1867,"totalBalls":4178,"gearBalls":1385,"gearShare":33.15,"highlight":false},{"rank":12,"batter":"H Masakadza","careerRuns":1649,"totalBalls":3630,"gearBalls":1187,"gearShare":32.7,"highlight":false},{"rank":13,"batter":"VD Philander","careerRuns":1779,"totalBalls":3995,"gearBalls":1305,"gearShare":32.67,"highlight":false},{"rank":14,"batter":"Imran Farhat","careerRuns":1568,"totalBalls":3334,"gearBalls":1084,"gearShare":32.51,"highlight":false},{"rank":15,"batter":"S Chanderpaul","careerRuns":5995,"totalBalls":13555,"gearBalls":4400,"gearShare":32.46,"highlight":false}];
    const TOP7_BASELINE = 26.91199479;
    const BASE_COLOR = "#687680";
    const BASELINE_COLOR = "#26323d";

    const lollipopPlugin = {
      id: "lollipop",
      beforeDatasetsDraw(chart) {
        const { ctx, chartArea, scales } = chart;
        const meta = chart.getDatasetMeta(0);
        if (!chartArea || !meta.data.length) return;

        ctx.save();
        const baselineX = scales.x.getPixelForValue(TOP7_BASELINE);
        ctx.strokeStyle = "rgba(38, 50, 61, 0.72)";
        ctx.lineWidth = 1.2;
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.moveTo(baselineX, chartArea.top);
        ctx.lineTo(baselineX, chartArea.bottom);
        ctx.stroke();
        ctx.setLineDash([]);

        meta.data.forEach((point, index) => {
          const player = PLAYERS[index];
          const zeroX = scales.x.getPixelForValue(0);
          const valueX = scales.x.getPixelForValue(player.gearShare);
          ctx.strokeStyle = "rgba(104, 118, 128, 0.52)";
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(zeroX, point.y);
          ctx.lineTo(valueX, point.y);
          ctx.stroke();
        });
        ctx.restore();
      },
      afterDatasetsDraw(chart) {
        const { ctx, chartArea, scales } = chart;
        const meta = chart.getDatasetMeta(0);
        if (!chartArea || !meta.data.length) return;

        ctx.save();
        meta.data.forEach((point, index) => {
          const player = PLAYERS[index];
          const x = scales.x.getPixelForValue(player.gearShare) + 8;
          ctx.fillStyle = "#52606c";
          ctx.font = "10.5px Arial";
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.fillText(`${player.gearShare.toFixed(1)}%`, x, point.y);
        });

        const baselineX = scales.x.getPixelForValue(TOP7_BASELINE);
        const label = `Top-seven baseline: ${TOP7_BASELINE.toFixed(1)}%`;
        ctx.font = "700 10.5px Arial";
        const labelWidth = ctx.measureText(label).width;
        const labelX = Math.min(
          Math.max(baselineX + 6, chartArea.left + 4),
          chartArea.right - labelWidth - 4
        );
        ctx.fillStyle = BASELINE_COLOR;
        ctx.textAlign = "left";
        ctx.textBaseline = "bottom";
        ctx.fillText(label, labelX, chartArea.top - 7);
        ctx.restore();
      }
    };

    Chart.register(lollipopPlugin);

    new Chart(document.getElementById("monasteriesChart"), {
      type: "scatter",
      data: {
        datasets: [{
          data: PLAYERS.map(player => ({
            x: player.gearShare,
            y: player.batter,
            ...player
          })),
          parsing: false,
          pointRadius: 4.5,
          pointHoverRadius: 7,
          pointBackgroundColor: BASE_COLOR,
          pointBorderColor: "#ffffff",
          pointBorderWidth: 1.2,
          showLine: false
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 180 },
        layout: { padding: { top: 28, right: 43 } },
        interaction: { mode: "nearest", axis: "y", intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            displayColors: false,
            backgroundColor: "rgba(23, 33, 43, 0.96)",
            padding: 10,
            titleFont: { size: 12 },
            bodyFont: { size: 11 },
            callbacks: {
              title(items) {
                return items[0].raw.batter;
              },
              label(context) {
                const player = context.raw;
                return [
                  `Gear 0: ${player.gearShare.toFixed(2)}%`,
                  `${player.gearBalls.toLocaleString()} of ${player.totalBalls.toLocaleString()} balls`,
                  `${player.careerRuns.toLocaleString()} runs in the available data`
                ];
              }
            }
          }
        },
        scales: {
          x: {
            type: "linear",
            min: 0,
            max: 45,
            title: {
              display: true,
              text: "Fraction of balls in gear 0",
              color: "#42515e",
              font: { weight: "bold" }
            },
            ticks: {
              stepSize: 5,
              color: "#61707d",
              callback(value) { return `${value}%`; }
            },
            grid: { color: "rgba(217, 224, 229, 0.82)" },
            border: { color: "#8a98a4" }
          },
          y: {
            type: "category",
            labels: PLAYERS.map(player => player.batter),
            reverse: false,
            offset: true,
            ticks: {
              autoSkip: false,
              padding: 7,
              color: "#42515e",
              font: {
                family: "Arial",
                size: 11,
                weight: "400"
              }
            },
            grid: { display: false },
            border: { display: false }
          }
        }
      }
    });
  </script>
</body>
</html>
