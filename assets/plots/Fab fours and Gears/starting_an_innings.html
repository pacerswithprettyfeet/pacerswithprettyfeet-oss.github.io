<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starting an innings</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: #ffffff;
      color: #17212b;
      font-family: Arial, Helvetica, sans-serif;
    }

    figure {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 6px 8px 0;
      overflow: hidden;
    }

    .gear-legend {
      display: flex;
      min-height: 30px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 5px 13px;
      color: #53616d;
      font-size: 10px;
      line-height: 1;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
    }

    .swatch {
      width: 10px;
      height: 10px;
      margin-right: 4px;
    }

    .panel-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      width: 100%;
    }

    .panel {
      width: 100%;
      min-width: 0;
      overflow: hidden;
    }

    .chart-wrap {
      position: relative;
      width: 100%;
      min-width: 0;
      height: 300px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100% !important;
      max-width: 100%;
    }

    figcaption {
      padding: 5px 8px 0 89px;
      color: #61707d;
      font-size: 10px;
      font-weight: 400;
      line-height: 1.42;
      letter-spacing: 0;
    }

    @media (max-width: 760px) {
      figure {
        width: 100vw;
        max-width: 100vw;
        padding: 4px 5px 0;
      }

      .gear-legend {
        min-height: 42px;
        gap: 5px 10px;
        font-size: 9px;
      }

      .panel-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
      }

      .starts-wrap { height: 280px; }

      figcaption {
        padding: 5px 7px 0;
        font-size: 9px;
      }

    }
  </style>
</head>
<body>
  <figure>
    <div class="gear-legend" id="gearLegend"></div>
    <div class="panel-grid">
      <section class="panel">
        <div class="chart-wrap starts-wrap">
          <canvas id="startsChart" aria-label="First-segment gear distribution for the Fab Four and top-seven baseline"></canvas>
        </div>
      </section>

    </div>
    <figcaption>Gear share of the first segment in each innings for the Fab Four and the top-seven men's Test baseline. Williamson is the most conservative starter, beginning 39.0% of his innings in gear 0; Root starts in gear 3 or higher 35.3% of the time. Smith is the outlier at both ends: he starts in gear 0 least often (23.1%) and begins in gears 5 or 6 more often than the other three (14.4%). Hover over a segment for the innings count.</figcaption>
  </figure>

are":6.15384615384615,"color":"#c85f4d","textColor":"#ffffff"},{"gear":6,"count":4,"share":2.0512820512820498,"color":"#8e5ea2","textColor":"#ffffff"}],"career":[{"gear":0,"balls":4855,"share":26.521359117229323,"color":"#5b6770","textColor":"#ffffff"},{"gear":1,"balls":4039,"share":22.063804217196548,"color":"#4878a8","textColor":"#ffffff"},{"gear":2,"balls":2878,"share":15.72162132634109,"color":"#3e9f8f","textColor":"#ffffff"},{"gear":3,"balls":2077,"share":11.346006773735388,"color":"#76a842","textColor":"#17212b"},{"gear":4,"balls":1280,"share":6.992242980443571,"color":"#d79a2b","textColor":"#17212b"},{"gear":5,"balls":1848,"share":10.095050803015404,"color":"#c85f4d","textColor":"#ffffff"},{"gear":6,"balls":1329,"share":7.259914782038676,"color":"#8e5ea2","textColor":"#ffffff"}]},{"batter":"SPD Smith","entity":"Steve Smith","shortName":"Smith","isBaseline":false,"isSmith":true,"innings":216,"careerBalls":19834,"starts":[{"gear":0,"count":50,"share":23.148148148148138,"color":"#5b6770","textColor":"#ffffff"},{"gear":1,"count":57,"share":26.38888888888889,"color":"#4878a8","textColor":"#ffffff"},{"gear":2,"count":43,"share":19.907407407407398,"color":"#3e9f8f","textColor":"#ffffff"},{"gear":3,"count":23,"share":10.64814814814814,"color":"#76a842","textColor":"#17212b"},{"gear":4,"count":12,"share":5.55555555555555,"color":"#d79a2b","textColor":"#17212b"},{"gear":5,"count":20,"share":9.25925925925925,"color":"#c85f4d","textColor":"#ffffff"},{"gear":6,"count":11,"share":5.09259259259259,"color":"#8e5ea2","textColor":"#ffffff"}],"career":[{"gear":0,"balls":4844,"share":24.422708480387215,"color":"#5b6770","textColor":"#ffffff"},{"gear":1,"balls":4288,"share":21.61944136331552,"color":"#4878a8","textColor":"#ffffff"},{"gear":2,"balls":3212,"share":16.19441363315519,"color":"#3e9f8f","textColor":"#ffffff"},{"gear":3,"balls":2486,"share":12.534032469496823,"color":"#76a842","textColor":"#17212b"},{"gear":4,"balls":1498,"share":7.5526873046284155,"color":"#d79a2b","te share":15.24356869184455,"color":"#3e9f8f","textColor":"#ffffff"},{"gear":3,"count":2384,"share":10.87392811530742,"color":"#76a842","textColor":"#17212b"},{"gear":4,"count":1324,"share":6.03904397007845,"color":"#d79a2b","textColor":"#17212b"},{"gear":5,"count":1564,"share":7.133734719941611,"color":"#c85f4d","textColor":"#ffffff"},{"gear":6,"count":823,"share":3.7538770297390904,"color":"#8e5ea2","textColor":"#ffffff"}],"career":[{"gear":0,"balls":389947,"share":26.91199478802543,"color":"#5b6770","textColor":"#ffffff"},{"gear":1,"balls":309537,"share":21.36253934688824,"color":"#4878a8","textColor":"#ffffff"},{"gear":2,"balls":223800,"share":15.445443697630939,"color":"#3e9f8f","textColor":"#ffffff"},{"gear":3,"balls":174336,"share":12.03171077958082,"color":"#76a842","textColor":"#17212b"},{"gear":4,"balls":107242,"share":7.401252337003294,"color":"#d79a2b","textColor":"#17212b"},{"gear":5,"balls":141071,"share":9.735943645524996,"color":"#c85f4d","textColor":"#ffffff"},{"gear":6,"balls":103038,"share":7.111115405346276,"color":"#8e5ea2","textColor":"#ffffff"}]}];
    const GEAR_COLORS = ["#5b6770", "#4878a8", "#3e9f8f", "#76a842", "#d79a2b", "#c85f4d", "#8e5ea2"];
    const GEAR_TEXT_COLORS = ["#ffffff", "#ffffff", "#ffffff", "#17212b", "#17212b", "#ffffff", "#ffffff"];

    document.getElementById("gearLegend").innerHTML = GEAR_COLORS.map((color, gear) =>
      `<span class="legend-item"><span class="swatch" style="background:${color}"></span>G${gear}</span>`
    ).join("");

    const startRows = RECORDS.map(record => ({
      record,
      label: record.shortName,
      type: "start",
      shares: record.starts.map(gear => gear.share)
    }));
    const rowBackgrounds = {
      id: "rowBackgrounds",
      beforeDatasetsDraw(chart) {
        if (chart.canvas.id !== "startsChart") return;
        const rows = startRows;
        const bars = chart.getDatasetMeta(0).data;
        if (bars.length < 2) return;
        const rowHeight = Math.abs(bars[0].y - bars[1].y);
        const { ctx, chartArea } = chart;
        ctx.save();
        rows.forEach((row, index) => {
          if (!row.record.isBaseline) return;
          ctx.fillStyle = "rgba(78, 101, 115, 0.055)";
          ctx.fillRect(
            chartArea.left,
            bars[index].y - rowHeight / 2,
            chartArea.width,
            rowHeight
          );
        });
        ctx.restore();
      }
    };

    const stackLabels = {
      id: "stackLabels",
      afterDatasetsDraw(chart) {
        if (chart.canvas.id !== "startsChart") return;
        const { ctx } = chart;
        ctx.save();
        chart.data.datasets.forEach((dataset, datasetIndex) => {
          const meta = chart.getDatasetMeta(datasetIndex);
          meta.data.forEach((bar, rowIndex) => {
            const value = Number(dataset.data[rowIndex]);
            const props = bar.getProps(["x", "base", "y"], true);
            if (datasetIndex === 6) {
              ctx.fillStyle = "#704884";
              ctx.font = "bold 8px Arial";
              ctx.textAlign = "left";
              ctx.textBaseline = "middle";
              ctx.fillText(`${value.toFixed(1)}%`, props.x + 5, props.y);
              return;
            }
            const width = Math.abs(props.x - props.base);
            const narrow = width < 29;
            const label = narrow ? `${Math.round(value)}%` : `${value.toFixed(1)}%`;
            const fontSize = width < 8 ? 5.5 : narrow ? 7 : 9;
            ctx.fillStyle = dataset.textColor;
            ctx.font = `bold ${fontSize}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.save();
            ctx.translate((props.x + props.base) / 2, props.y);
            if (narrow) ctx.rotate(-Math.PI / 2);
            ctx.fillText(label, 0, 0);
            ctx.restore();
          });
        });
        ctx.restore();
      }
    };

    Chart.register(rowBackgrounds, stackLabels);

    function datasetsFor(rows, thickness) {
      return GEAR_COLORS.map((color, gear) => ({
        label: `Gear ${gear}`,
        data: rows.map(row => row.shares[gear]),
        backgroundColor: color,
        borderColor: "#ffffff",
        borderWidth: 0.8,
        borderSkipped: false,
        textColor: GEAR_TEXT_COLORS[gear],
        barThickness: thickness
      }));
    }

    function tooltipLabel(row, gear) {
      if (row.type === "start") {
        const value = row.record.starts[gear];
        return `Gear ${gear}: ${value.share.toFixed(1)}% (${value.count.toLocaleString()} innings)`;
      }
      const value = row.record.career[gear];
      return `Gear ${gear}: ${value.share.toFixed(1)}% (${value.balls.toLocaleString()} balls)`;
    }

    function makeStackedChart(canvasId, rows, thickness) {
      return new Chart(document.getElementById(canvasId), {
        type: "bar",
        data: {
          labels: rows.map(row => row.label),
          datasets: datasetsFor(rows, thickness)
        },
        options: {
          indexAxis: "y",
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 180 },
          layout: { padding: { top: 8, right: 38, bottom: 4 } },
          interaction: { mode: "nearest", intersect: true },
          plugins: {
            legend: { display: false },
            tooltip: {
              displayColors: true,
              backgroundColor: "rgba(23, 33, 43, 0.97)",
              padding: 10,
              titleFont: { size: 12 },
              bodyFont: { size: 11 },
              callbacks: {
                title(items) {
                  const row = rows[items[0].dataIndex];
                  return row.type === "start"
                    ? `${row.record.entity}: first segment`
                    : `${row.record.entity}: career`;
                },
                label(context) {
                  return tooltipLabel(rows[context.dataIndex], context.datasetIndex);
                }
              }
            }
          },
          scales: {
            x: {
              stacked: true,
              min: 0,
              max: 100,
              ticks: {
                stepSize: 25,
                color: "#61707d",
                font: { size: 8 },
                callback(value) { return `${value}%`; }
              },
              grid: { color: "rgba(217, 224, 229, 0.7)" },
              border: { color: "#8a98a4" }
            },
            y: {
              stacked: true,
              ticks: {
                autoSkip: false,
                color(context) {
                  const row = rows[context.index];
                  return row.record.isBaseline ? "#26323d" : "#42515e";
                },
                font(context) {
                  const row = rows[context.index];
                  return {
                    size: canvasId === "startsChart" ? 9 : 8,
                    weight: row.record.isBaseline ? "bold" : "normal"
                  };
                },
                padding: 6
              },
              grid: { display: false },
              border: { display: false }
            }
          }
        }
      });
    }

    makeStackedChart(
      "startsChart",
      startRows,
      window.innerWidth <= 760 ? 28 : 32
    );
  </script>
</body>
</html>
