,"bowler":"NM Lyon","over":125,"delivery":5,"legByes":0},{"ball":218,"modelRun":0,"modelCumulative":132,"segmentIndex":8,"gear":5,"bowler":"NM Lyon","over":125,"delivery":6,"legByes":0},{"ball":219,"modelRun":4,"modelCumulative":136,"segmentIndex":8,"gear":5,"bowler":"PJ Cummins","over":126,"delivery":4,"legByes":0}];
    const GEAR_COLORS = ["#5b6770", "#4878a8", "#3e9f8f", "#76a842", "#d79a2b", "#c85f4d", "#8e5ea2"];
    const previewSegment = Number(new URLSearchParams(window.location.search).get("segment"));
    let hoveredSegmentIndex = Number.isInteger(previewSegment) && previewSegment >= 1 && previewSegment <= 9
      ? previewSegment - 1
      : null;

    function rgba(hex, alpha) {
      const value = hex.replace("#", "");
      const red = parseInt(value.slice(0, 2), 16);
      const green = parseInt(value.slice(2, 4), 16);
      const blue = parseInt(value.slice(4, 6), 16);
      return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
    }

    function roundedRect(ctx, x, y, width, height, radius) {
      const right = x + width;
      const bottom = y + height;
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(right - radius, y);
      ctx.quadraticCurveTo(right, y, right, y + radius);
      ctx.lineTo(right, bottom - radius);
      ctx.quadraticCurveTo(right, bottom, right - radius, bottom);
      ctx.lineTo(x + radius, bottom);
      ctx.quadraticCurveTo(x, bottom, x, bottom - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    const segmentPanelPlugin = {
      id: "segmentPanel",
      beforeDatasetsDraw(chart) {
        const { ctx, chartArea, scales } = chart;
        if (!chartArea) return;

        const panelHeight = 28;
        const panelTop = chartArea.top - panelHeight;
        ctx.save();

        SEGMENTS.forEach(segment => {
          const left = scales.x.getPixelForValue(segment.start - 0.5);
          const right = scales.x.getPixelForValue(segment.end + 0.5);
          const color = GEAR_COLORS[segment.gear];

          ctx.fillStyle = rgba(color, 0.055);
          ctx.fillRect(left, chartArea.top, right - left, chartArea.bottom - chartArea.top);

          ctx.fillStyle = color;
          ctx.fillRect(left, panelTop, right - left, panelHeight);
          ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
          ctx.lineWidth = 1;
          ctx.strokeRect(left, panelTop, right - left, panelHeight);

          if (right - left >= 20) {
            ctx.fillStyle = segment.gear === 3 || segment.gear === 4 ? "#17212b" : "#ffffff";
            ctx.font = "700 10px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(`G${segment.gear}`, (left + right) / 2, panelTop + panelHeight / 2);
          }
        });

        SEGMENTS.slice(0, -1).forEach(segment => {
          const x = scales.x.getPixelForValue(segment.end + 0.5);
          ctx.strokeStyle = "rgba(97, 112, 125, 0.5)";
          ctx.lineWidth = 1;
          ctx.setLineDash([3, 4]);
          ctx.beginPath();
          ctx.moveTo(x, chartArea.top);
          ctx.lineTo(x, chartArea.bottom);
          ctx.stroke();
        });

        ctx.restore();
      },
      afterEvent(chart, args) {
        const { event } = args;
        const { chartArea, scales } = chart;
        if (!chartArea) return;

        const panelTop = chartArea.top - 28;
        let nextSegmentIndex = null;
        if (
          event.type !== "mouseout"
          && event.x >= chartArea.left
          && event.x <= chartArea.right
          && event.y >= panelTop
          && event.y <= chartArea.bottom
        ) {
          const ball = scales.x.getValueForPixel(event.x);
          const segment = SEGMENTS.find(item => ball >= item.start - 0.5 && ball <= item.end + 0.5);
          nextSegmentIndex = segment ? segment.index : null;
        }

        if (nextSegmentIndex !== hoveredSegmentIndex) {
          hoveredSegmentIndex = nextSegmentIndex;
          args.changed = true;
        }
      },
      afterDraw(chart) {
        if (hoveredSegmentIndex === null) return;

        const { ctx, chartArea, scales } = chart;
        const segment = SEGMENTS[hoveredSegmentIndex];
        const left = scales.x.getPixelForValue(segment.start - 0.5);
        const right = scales.x.getPixelForValue(segment.end + 0.5);
        const pointerX = (left + right) / 2;
        const title = `Segment ${segment.number} | Gear ${segment.gear}`;
        const detail = `${segment.modelRuns} runs | ${segment.balls} balls | SR ${segment.modelSR.toFixed(1)}`;

        ctx.save();
        ctx.font = "700 11px Arial";
        const titleWidth = ctx.measureText(title).width;
        ctx.font = "11px Arial";
        const detailWidth = ctx.measureText(detail).width;
        const bubbleWidth = Math.max(titleWidth, detailWidth) + 20;
        const bubbleHeight = 45;
        const bubbleX = Math.max(
          chartArea.left + 4,
          Math.min(pointerX - bubbleWidth / 2, chartArea.right - bubbleWidth - 4)
        );
        const bubbleY = chartArea.top + 9;

        ctx.fillStyle = "rgba(23, 33, 43, 0.96)";
        ctx.beginPath();
        ctx.moveTo(pointerX, chartArea.top + 1);
        ctx.lineTo(pointerX - 6, bubbleY);
        ctx.lineTo(pointerX + 6, bubbleY);
        ctx.closePath();
        ctx.fill();

        roundedRect(ctx, bubbleX, bubbleY, bubbleWidth, bubbleHeight, 5);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.font = "700 11px Arial";
        ctx.fillText(title, bubbleX + 10, bubbleY + 15);
        ctx.font = "11px Arial";
        ctx.fillText(detail, bubbleX + 10, bubbleY + 31);
        ctx.restore();
      }
    };

    Chart.register(segmentPanelPlugin);

    new Chart(document.getElementById("headingleyChart"), {
      type: "bar",
      data: {
        datasets: [{
          data: BALLS.map(ball => ({ ...ball, x: ball.ball, y: ball.modelRun })),
          parsing: false,
          backgroundColor: context => {
            const raw = context.raw;
            return raw ? rgba(GEAR_COLORS[raw.gear], 0.86) : "transparent";
          },
          borderWidth: 0,
          barPercentage: 1,
          categoryPercentage: 1
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 180 },
        layout: { padding: { top: 28 } },
        interaction: { mode: "nearest", axis: "x", intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: { enabled: false }
        },
        scales: {
          x: {
            type: "linear",
            min: 0.5,
            max: 219.5,
            offset: false,
            title: {
              display: true,
              text: "Ball faced",
              color: "#42515e",
              font: { weight: "bold" }
            },
            ticks: {
              color: "#61707d",
              maxTicksLimit: 7,
              callback(value) {
                return Number.isInteger(value) ? value : "";
              }
            },
            grid: { display: false },
            border: { color: "#8a98a4" }
          },
          y: {
            beginAtZero: true,
            max: 6,
            title: {
              display: true,
              text: "Runs on ball",
              color: "#42515e",
              font: { weight: "bold" }
            },
            ticks: { color: "#61707d", stepSize: 1 },
            grid: { color: "rgba(217, 224, 229, 0.88)" },
            border: { color: "#8a98a4" }
          }
        }
      }
