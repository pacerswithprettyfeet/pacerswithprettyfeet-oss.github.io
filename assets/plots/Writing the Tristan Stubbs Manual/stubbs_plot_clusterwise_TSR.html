<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T Stubbs Cluster-wise True Strike Rate</title>

<style>
body {
  margin: 0;
  padding: 32px;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
}

.container {
  max-width: 950px;
  margin: auto;
  background: white;
  border-radius: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  overflow: hidden;
}

.header {
  padding: 24px 28px;
  border-bottom: 1px solid #e5e7eb;
}

h1 {
  margin: 0;
  font-size: 26px;
}

.subtitle {
  margin-top: 6px;
  color: #6b7280;
  font-size: 14px;
  line-height: 1.5;
}

.table-wrap {
  padding: 20px 28px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead {
  background: #eef2ff;
}

th {
  text-align: left;
  padding: 10px;
  font-size: 12px;
  color: #1e3a8a;
  text-transform: uppercase;
}

td {
  padding: 10px;
  border-bottom: 1px solid #e5e7eb;
}

tr:hover {
  background: #f9fafb;
}

.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.positive {
  color: #047857;
  font-weight: 700;
}

.negative {
  color: #b91c1c;
  font-weight: 700;
}

.highlight {
  background: #fffbeb;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>T Stubbs: Cluster-wise True Strike Rate</h1>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Segment</th>
<th class="num">Runs</th>
<th class="num">Balls</th>
<th class="num">SR</th>
<th class="num">Expected SR</th>
<th class="num">True SR</th>
<th class="num">Matches</th>
</tr>
</thead>

<tbody>

<tr>
<td>1–8 balls</td>
<td class="num">238</td>
<td class="num">204</td>
<td class="num">116.67</td>
<td class="num">154.86</td>
<td class="num negative">-38.19</td>
<td class="num">30</td>
</tr>

<tr class="highlight">
<td>9–16 balls</td>
<td class="num">253</td>
<td class="num">128</td>
<td class="num">197.66</td>
<td class="num">170.29</td>
<td class="num positive">+27.36</td>
<td class="num">20</td>
</tr>

<tr class="highlight">
<td>17–24 balls</td>
<td class="num">174</td>
<td class="num">78</td>
<td class="num">223.08</td>
<td class="num">193.07</td>
<td class="num positive">+30.01</td>
<td class="num">13</td>
</tr>

<tr class="highlight">
<td>25–32 balls</td>
<td class="num">34</td>
<td class="num">17</td>
<td class="num">200.00</td>
<td class="num">158.77</td>
<td class="num positive">+41.23</td>
<td class="num">4</td>
</tr>

<tr>
<td>33–40 balls</td>
<td class="num">6</td>
<td class="num">4</td>
<td class="num">150.00</td>
<td class="num">182.35</td>
<td class="num negative">-32.35</td>
<td class="num">1</td>
</tr>

</tbody>
</table>
</div>

</div>

</body>
</html>
